# Local stand-in for a managed queue (SQS / Pub/Sub / Service Bus): NATS JetStream.
#
# Flisk loads this file when it exists (engine: infra-loader.star). It does not
# generate it. The container must be called <project>_nats because that is the
# host in TILT_NATS_URL.
services:
  nats:
    image: nats:2.10-alpine
    container_name: flisk_agent_stack_nats
    command: ["-js", "-sd", "/data", "-m", "8222"]
    restart: unless-stopped
    volumes:
      - flisk_agent_stack_nats_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz | grep -q ok"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  flisk_agent_stack_nats_data:

networks:
  backend:
    name: flisk_agent_stack_backend
    external: true
